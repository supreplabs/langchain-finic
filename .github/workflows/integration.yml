name: Live integration tests
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      FINIC_API_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: live-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  credentials:
    name: Check live-test configuration
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check API key availability
        id: check
        env:
          FINIC_API_KEY: ${{ secrets.FINIC_API_KEY }}
        run: |
          if [ -n "$FINIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Live integration tests skipped: FINIC_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
  live:
    name: Finic live contracts
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --locked --group test
      - name: Run live standard tests and classifier smoke tests
        id: contracts
        env:
          FINIC_API_KEY: ${{ secrets.FINIC_API_KEY }}
          FINIC_MODEL: grayson-1
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: make integration_test LIVE_TEST_ARGS='-p scripts.live_requests --junitxml=artifacts/live/results.xml'
      - name: Prepare sanitized evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.contracts.outcome == 'success' && 'success' || 'failure' }}
        run: uv run --locked --group test python scripts/live_evidence.py --directory artifacts/live --outcome "$TEST_OUTCOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live/evidence.*
          if-no-files-found: warn
          retention-days: 90
  evidence:
    name: Record live-test evidence
    needs: [credentials, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: live-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live
      - name: Record skipped or interrupted runs
        env:
          FALLBACK_OUTCOME: ${{ needs.credentials.result == 'success' && needs.credentials.outputs.enabled != 'true' && 'skipped' || 'failure' }}
        run: |
          if [ ! -f artifacts/live/evidence.json ]; then
            python scripts/live_evidence.py --directory artifacts/live --outcome "$FALLBACK_OUTCOME"
          fi
          cat artifacts/live/evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live/evidence.*
          if-no-files-found: error
          retention-days: 90
      - name: Link daily and manual evidence to the observation issue
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 11 --body-file artifacts/live/evidence.md
