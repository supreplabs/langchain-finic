name: Live integration tests
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      FINIC_API_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: live-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  credentials:
    name: Check live-test configuration
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check API key availability
        id: check
        env:
          FINIC_API_KEY: ${{ secrets.FINIC_API_KEY }}
        run: |
          if [ -n "$FINIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Live integration tests skipped: FINIC_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
  live:
    name: Finic live contracts
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --locked --group test
      - name: Run live standard tests and classifier smoke tests
        env:
          FINIC_API_KEY: ${{ secrets.FINIC_API_KEY }}
          FINIC_MODEL: grayson-1
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: make integration_test
