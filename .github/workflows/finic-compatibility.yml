name: Finic compatibility
on:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: finic-compatibility
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare provider reference and track gaps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/finic_compatibility.py --create-issues
