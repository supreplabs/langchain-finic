[project]
name = "langchain-finic"
version = "0.1.0a6"
description = "LangChain tools, typed Runnables, and middleware for Finic Grayson."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Suprep Labs"}]
maintainers = [{name = "Suprep Labs"}]
keywords = ["langchain", "langgraph", "finic", "grayson", "agents"]
dependencies = ["httpx>=0.28.1,<1", "langchain-core>=1,<2", "langsmith>=0.3,<1", "pydantic>=2.12,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/supreplabs/langchain-finic"
Documentation = "https://supreplabs.github.io/langchain-finic/"
Repository = "https://github.com/supreplabs/langchain-finic"
Issues = "https://github.com/supreplabs/langchain-finic/issues"
Changelog = "https://github.com/supreplabs/langchain-finic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
middleware = ["langchain>=1,<2", "langgraph>=1,<2"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "langchain-tests==1.1.9", "langchain>=1,<2", "langgraph>=1,<2"]
lint = ["ruff>=0.12,<1", "mypy>=1.15,<3"]
docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.30,<2"]
build = ["twine>=7,<8", "packaging>=24"]
dev = [{include-group="test"}, {include-group="lint"}, {include-group="docs"}, {include-group="build"}]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_finic"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/RELEASING.md", "/LANGCHAIN_LISTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/Makefile", "/mkdocs.yml", "/uv.lock"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: explicit, paid Finic decision checks; never run in default CI",
  "lifecycle: separately authorized synthetic model creation and calibration",
]

[tool.mypy]
python_version = "3.11"
files = ["src/langchain_finic", "tests/typing/public_interfaces.py"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true


[[tool.mypy.overrides]]
module = ["langchain_finic.middleware", "langchain_finic.scorer", "langchain_finic.classifier", "langchain_finic._runnable", "langchain_finic._binding"]
disallow_untyped_defs = true
